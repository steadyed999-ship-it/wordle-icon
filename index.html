<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta property="og:title" content="Our Daily Score">
<meta property="og:description" content="Join my group and compare our daily word puzzle scores!">
<meta property="og:image" content="https://steadyed999-ship-it.github.io/wordle-icon/ods-share.png?v=3">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<link rel="manifest" href="https://steadyed999-ship-it.github.io/wordle-icon/manifest.json?v=10">
<link rel="apple-touch-icon" sizes="180x180" href="https://steadyed999-ship-it.github.io/wordle-icon/ods-icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="https://steadyed999-ship-it.github.io/wordle-icon/ods-favicon-32.png?v=3">
<link rel="shortcut icon" href="https://steadyed999-ship-it.github.io/wordle-icon/ods-favicon-32.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Daily Score">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Daily Score</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #101012;
    overflow: hidden;
  }
  #app {
    display: block;
    border: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>
  <!-- The scoreboard app loads right here, filling the whole screen.
       No "Open App" button needed. -->
  <iframe id="app" title="Our Daily Score" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // The real app (Google Apps Script).
    var APP_URL = "https://script.google.com/macros/s/AKfycbxPyh1yeKwhdabNFEMGV1DTYmGn0VF7ztqLBsDTqThD8xzrwDsP3ABOctfopDo1RdT2/exec";

    // If this page was opened with ?group=...&player=... (from someone's
    // personal Home Screen icon), pass those same codes on to the app so it
    // opens as the right person in the right group.
    document.getElementById('app').src = APP_URL + window.location.search;
  </script>
</body>
</html>
